<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description" content="Contact us for anything you need and for suggestions">
    <meta name="author" content="Adroaldo Junior Santangelo">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/z-splash.png" alt="Company's Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>

        </nav>
    </header>

    <main>
        <h1> White Water Rafting Company</h1>
        <p>Santana do Livramente - RS</p>
        <p>+1 999 999 999</p>
        <p>info@whitewater.com</p>

        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name here" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="email@email.com" required>

            <fieldset>
                <legend>Message Purpose</legend>
                <label><input type="radio" name="General Inquiry" value="General Inquiry">General
                    Inquiry</label>
                <label><input type="radio" name="Reservation Question"
                      value="Reservation Question">Reservation Question</label>
                <label><input type="radio" name="Website Suggestion"
                      value="Website Suggestion">Website Suggestion</label>
            </fieldset>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <label><input type="checkbox" id="subscribe" name="subscribe">Please subscribe me to the
                monthly newsletter</label>

            <button type="submit">Get in Touch!</button>
        </form>

        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d37215.70417104089!2d-56.575961274995585!3d-29.134172521260396!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94545e2566d4c287%3A0x1b8d9da185fedffd!2sItaqui%2C%20RS%2C%2097650-000!5e0!3m2!1sen!2sbr!4v1792039133105!5m2!1sen!2sbr"
          width="600" height="450" allowfullscreen="" loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <section>
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="/wwr/images/thedigitalartist.jpg" alt="Call center female attendant">
                <figcaption>Rebeca Seballos</figcaption>
            </figure>
            <figure>
                <img src="/wwr/images/kampus-8441870.jpg" alt="Elderly employees">
                <figcaption>Eiring Family</figcaption>
            </figure>
            <figure>
                <img src="/wwr/images/mikhail-nilov-9301747.jpg" alt="Another employee">
                <figcaption>Edward Strauss</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>©️2026 White Water Rafting Adroaldo Junior Santangelo</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook logo">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.svg" alt="Facebook logo">
            </a>
            <a href="https://www.linkedin.com/">
                <img src="images/linkedin.svg" alt="Facebook logo">
            </a>
        </nav>
    </footer>


</body>

</html>
